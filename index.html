<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoSham Bo — Prismatic Aurora 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --disp:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ink:#090D16; --ink-soft:#5b6472;
  --c-green:#2fae57; --c-blue:#3b82f6; --c-red:#ef4553; --c-yellow:#f2a51c;
  --floor-1:#fbfdff; --floor-2:#e7edf6;
  --rim-1:#dbe4f0; --rim-2:#b9c6da; --rim-line:rgba(255,255,255,.85);
  --tile:rgba(255,255,255,.55); --tile-alt:rgba(210,222,238,.5);
  --pit:rgba(120,150,190,.5);
  --stone-1:#c3cddd; --stone-2:#9aa8bd; --stone-sheen:rgba(255,255,255,.8);
  --pad-dead:#aeb6c2; --pad-base:rgba(255,255,255,.7);
  --glow:#7fe0ff;
  --accent:#0e7bc4;
  --d-move:#12b886; --d-stomp:#ef4553; --d-support:#3b82f6; --d-lock:#8b95a3; --d-risk:#f59f00;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--disp); color:var(--ink); min-height:100vh; position:relative; overflow-x:hidden;
  background:radial-gradient(1200px 700px at 82% -8%, #eef4ff 0%, transparent 60%),
             radial-gradient(1000px 720px at -8% 112%, #eafaf1 0%, transparent 55%),
             linear-gradient(160deg,#FCFDFE 0%,#F2F5FA 46%,#EDF1F7 100%);
  -webkit-tap-highlight-color:transparent;
}
/* 3-layer atmospheric stage */
#stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(85px);opacity:.55;mix-blend-mode:multiply;}
.orb.a{width:46vw;height:46vw;left:-6vw;top:-8vw;background:rgba(14,165,233,.22);animation:drift 22s ease-in-out infinite;}
.orb.b{width:40vw;height:40vw;right:-6vw;top:6vw;background:rgba(228,5,33,.14);animation:drift 26s ease-in-out infinite reverse;}
.orb.c{width:44vw;height:44vw;left:24vw;bottom:-14vw;background:rgba(245,158,11,.16);animation:drift 30s ease-in-out infinite;}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}33%{transform:translate3d(6vw,4vh,0)}66%{transform:translate3d(-4vw,6vh,0)}}
#stage::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(15,23,42,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.026) 1px,transparent 1px);
  background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 55%,transparent 92%);mask-image:radial-gradient(ellipse at 50% 30%,#000 55%,transparent 92%);}
.screen{position:relative;z-index:2;max-width:1460px;margin:0 auto;padding:22px 24px;}
.hidden{display:none!important;}

/* double-bezel glass */
.spotlight-prism{position:relative;padding:4px;border-radius:30px;
  background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,255,255,.36));
  border:1px solid rgba(255,255,255,.96);
  box-shadow:0 22px 55px -14px rgba(15,23,42,.14),0 2px 6px -1px rgba(15,23,42,.05);
  backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);
  transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s cubic-bezier(.16,1,.3,1);}
.spotlight-prism::before{content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.6),transparent 60%);opacity:.7;}
.prism-chamber{border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.62));
  border:1px solid rgba(226,232,240,.75);box-shadow:inset 0 1px 0 0 rgba(255,255,255,1);}

/* buttons */
.btn-primary{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.2px;color:#fff;border:none;cursor:pointer;
  padding:15px 34px;border-radius:16px;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#12a3e6,#0b6fb8);
  box-shadow:0 14px 30px -10px rgba(11,111,184,.6),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s;}
.btn-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-120%);transition:transform .6s;}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 20px 40px -12px rgba(11,111,184,.7);}
.btn-primary:hover::after{transform:translateX(120%);}
.btn-ghost{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;
  padding:14px 28px;border-radius:16px;border:1px solid rgba(148,163,184,.5);background:rgba(255,255,255,.6);
  transition:transform .3s cubic-bezier(.16,1,.3,1),background .3s;}
.btn-ghost:hover{transform:translateY(-2px);background:rgba(255,255,255,.9);}

/* ===== SETUP ===== */
#setup{display:flex;flex-direction:column;align-items:center;padding-top:7vh;}
.hero{text-align:center;margin-bottom:26px;}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.logo{font-size:clamp(52px,8vw,104px);font-weight:800;line-height:.96;letter-spacing:-2px;}
.logo em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent);letter-spacing:0;}
.tagline{color:var(--ink-soft);font-size:clamp(16px,2vw,21px);margin-top:10px;font-weight:600;}
.stars-strip{display:flex;gap:16px;justify-content:center;margin:26px 0 4px;}
.strip-star{display:block;width:58px;height:58px;filter:drop-shadow(0 10px 16px rgba(15,23,42,.22));animation:bob 3.4s ease-in-out infinite;}
.strip-star:nth-child(2){animation-delay:.4s}.strip-star:nth-child(3){animation-delay:.8s}.strip-star:nth-child(4){animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.setup-card{width:100%;max-width:940px;padding:4px;border-radius:30px;}
.setup-inner{padding:30px 34px 34px;}
.field-label{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);margin:6px 0 12px;}
.count-row{display:flex;gap:12px;margin-bottom:24px;}
.count-btn{flex:1;font-family:var(--disp);font-weight:800;font-size:20px;padding:16px;border-radius:16px;cursor:pointer;
  border:1px solid rgba(148,163,184,.4);background:rgba(255,255,255,.5);color:var(--ink-soft);transition:all .3s cubic-bezier(.16,1,.3,1);}
.count-btn:hover{transform:translateY(-2px);}
.count-btn.on{background:#090D16;color:#fff;border-color:#090D16;box-shadow:0 12px 26px -10px rgba(9,13,22,.6);}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
.seat{border-radius:20px;padding:18px 14px;text-align:center;border:1px solid rgba(226,232,240,.9);
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(248,250,253,.6));transition:all .3s cubic-bezier(.16,1,.3,1);}
.seat.off{opacity:.32;filter:grayscale(.7);}
.seat-star{width:46px;height:46px;margin:0 auto 6px;}
.seat-name{font-weight:800;font-size:18px;}
.seat-pos{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:12px;text-transform:uppercase;}
.mode-row{display:flex;gap:8px;justify-content:center;}
.mode-btn{font-family:var(--disp);font-weight:700;font-size:13px;padding:8px 14px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(148,163,184,.4);background:rgba(255,255,255,.7);color:var(--ink-soft);transition:all .25s;}
.mode-btn.on{color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(9,13,22,.5);}
.seat[data-color="green"] .mode-btn.on{background:var(--c-green);}
.seat[data-color="blue"] .mode-btn.on{background:var(--c-blue);}
.seat[data-color="red"] .mode-btn.on{background:var(--c-red);}
.seat[data-color="yellow"] .mode-btn.on{background:var(--c-yellow);color:#3a2c00;}
.setup-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}

/* ===== GAME ===== */
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.brand{font-weight:800;font-size:22px;letter-spacing:-.5px;}
.brand em{font-family:var(--serif);font-style:italic;color:var(--accent);}
.turn-pill{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:#fff;
  padding:9px 20px;border-radius:999px;background:var(--turn-color,#090D16);box-shadow:0 10px 24px -10px rgba(9,13,22,.5);transition:background .4s;}
.tp-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:beat 1.6s infinite;}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.tb-actions{margin-left:auto;display:flex;gap:10px;}
.icon-btn{font-family:var(--disp);font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(148,163,184,.4);background:rgba(255,255,255,.7);color:var(--ink-soft);transition:all .25s;}
.icon-btn:hover{transform:translateY(-2px);background:#fff;}
.layout{display:grid;grid-template-columns:280px minmax(360px,1fr) 320px;gap:18px;align-items:start;}
@media(max-width:1080px){.layout{grid-template-columns:1fr;}.col-board{order:1;}.col-left{order:2;}.col-right{order:3;}}
.col-left .pcard{padding:4px;border-radius:22px;margin-bottom:14px;}
.pcard>.prism-chamber,.pcard{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(250,251,254,.6));border:1px solid rgba(226,232,240,.9);
  border-radius:22px;padding:16px 18px;box-shadow:0 14px 34px -16px rgba(15,23,42,.2);}
.pcard{position:relative;overflow:hidden;}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c-green);}
.pcard[data-color="blue"]::before{background:var(--c-blue)}.pcard[data-color="red"]::before{background:var(--c-red)}.pcard[data-color="yellow"]::before{background:var(--c-yellow)}
.pcard.active{outline:2px solid var(--ink);outline-offset:-2px;box-shadow:0 18px 40px -16px rgba(15,23,42,.35);}
.pc-top{display:flex;align-items:center;gap:10px;}
.pc-star{width:30px;height:30px;}.pc-star svg{width:100%;height:100%;}
.pc-name{font-weight:800;font-size:17px;}
.pc-score{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:24px;}
.pc-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin:4px 0 10px;letter-spacing:.04em;}
.pc-vaults{display:flex;gap:8px;flex-wrap:wrap;}
.vault{font-size:12px;font-weight:700;padding:5px 11px;border-radius:10px;background:rgba(241,245,250,.9);border:1px solid rgba(226,232,240,.9);color:var(--ink-soft);}
.vault b{font-family:var(--mono);color:var(--ink);}

/* ===== 3D ARENA ===== */
.col-board{display:flex;flex-direction:column;align-items:center;}
.board-wrap{position:relative;width:100%;max-width:min(76vh,740px);perspective:1500px;perspective-origin:50% 10%;padding:6px 0 42px;}
#board{width:100%;height:auto;display:block;border-radius:26px;position:relative;z-index:1;
  transform-style:preserve-3d;transform:rotateX(var(--rx,22deg)) rotateY(var(--ry,0deg));transform-origin:50% 58%;
  transition:transform .7s cubic-bezier(.16,1,.3,1);
  box-shadow:0 40px 80px -30px rgba(15,23,42,.55),0 8px 24px -10px rgba(15,23,42,.3),inset 0 0 0 1px rgba(255,255,255,.5);}
/* the arena "table" shadow the board floats above */
.board-wrap::after{content:"";position:absolute;left:7%;right:7%;bottom:6px;height:52px;border-radius:50%;z-index:0;
  background:radial-gradient(ellipse at center,rgba(15,23,42,.34),rgba(15,23,42,.1) 55%,transparent 72%);filter:blur(12px);}
/* side-light edge under the tilted board for physical thickness */
.board-wrap::before{content:"";position:absolute;left:4%;right:4%;bottom:26px;height:26px;border-radius:0 0 26px 26px;z-index:0;
  background:linear-gradient(180deg,#8fa3bf,#5f7391);filter:blur(1px);
  clip-path:polygon(2% 0,98% 0,94% 100%,6% 100%);}

.controls{display:flex;align-items:center;gap:16px;margin-top:10px;perspective:320px;}
/* ===== 3D dice cube ===== */
.die{width:66px;height:66px;position:relative;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.9,.3,1.3);}
.die .face{position:absolute;inset:0;border-radius:15px;
  background:linear-gradient(145deg,#ffffff,#dce6f2);border:1px solid rgba(255,255,255,.95);
  box-shadow:inset 0 2px 5px rgba(255,255,255,.95),inset 0 -4px 8px rgba(154,168,189,.55);}
.die .face i{position:absolute;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#4d688a,#122238 72%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.5),0 1px 1px rgba(255,255,255,.8);}
.die .tl{top:14%;left:14%}.die .tr{top:14%;right:14%}.die .bl{bottom:14%;left:14%}.die .br{bottom:14%;right:14%}
.die .ml{top:calc(50% - 6px);left:14%}.die .mr{top:calc(50% - 6px);right:14%}
.die .c{top:calc(50% - 6px);left:calc(50% - 6px)}
.die .f1{transform:translateZ(33px)}
.die .f2{transform:rotateY(90deg) translateZ(33px)}
.die .f5{transform:rotateY(-90deg) translateZ(33px)}
.die .f3{transform:rotateX(90deg) translateZ(33px)}
.die .f4{transform:rotateX(-90deg) translateZ(33px)}
.die .f6{transform:rotateY(180deg) translateZ(33px)}
.die.rolling{animation:tumble .3s linear infinite;}
@keyframes tumble{from{transform:rotateX(15deg) rotateY(0deg)}to{transform:rotateX(375deg) rotateY(360deg)}}
.roll-btn{font-family:var(--disp);font-weight:800;font-size:19px;color:#fff;border:none;cursor:pointer;padding:16px 40px;border-radius:18px;
  background:linear-gradient(145deg,var(--roll-color,#12a3e6),color-mix(in srgb,var(--roll-color,#12a3e6) 70%,#000 30%));
  box-shadow:0 16px 34px -12px var(--roll-color,#12a3e6),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s,box-shadow .3s;}
.roll-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.03);}
.roll-btn:disabled{opacity:.35;cursor:not-allowed;}
.status-line{margin-top:14px;font-size:15px;font-weight:600;color:var(--ink-soft);text-align:center;max-width:640px;min-height:22px;}
.ai-chip{display:inline-block;font-family:var(--mono);font-size:12.5px;background:rgba(9,13,22,.06);padding:4px 12px;border-radius:999px;color:var(--ink);}
.chase-banner{display:none;margin-top:12px;font-weight:800;font-size:14px;color:#fff;padding:11px 24px;border-radius:999px;
  background:linear-gradient(120deg,#ef4553,#f2a51c);box-shadow:0 12px 28px -10px rgba(229,72,77,.6);}
.col-right{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(250,251,254,.6));border:1px solid rgba(226,232,240,.9);padding:16px 18px;border-radius:22px;box-shadow:0 14px 34px -16px rgba(15,23,42,.2);}
.panel-title{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;}
.log{max-height:56vh;overflow-y:auto;font-size:13px;line-height:1.5;}
.log .ev{padding:8px 4px;border-bottom:1px dashed rgba(148,163,184,.3);color:var(--ink-soft);}
.log .ev:first-child{color:var(--ink);font-weight:600;}
.cname-green{color:var(--c-green)}.cname-blue{color:var(--c-blue)}.cname-red{color:var(--c-red)}.cname-yellow{color:#b8860b}

/* board SVG theming */
#board .rim{fill:url(#rimGrad);}
#board .rim-line{fill:none;stroke:var(--rim-line);stroke-width:2;stroke-dasharray:14 10;opacity:.6;}
#board .fg1{stop-color:var(--floor-1)}#board .fg2{stop-color:var(--floor-2)}
#board .rg1{stop-color:var(--rim-1)}#board .rg2{stop-color:var(--rim-2)}
#board .floor-bg{fill:url(#floorGrad);}
#board .tile{fill:var(--tile);}#board .tile-alt{fill:var(--tile-alt);}
#board .pit-ring{fill:none;stroke:var(--pit);stroke-width:3;stroke-dasharray:9 9;}
#board .pad-base{fill:var(--pad-base);}
#board .pad-side,#board .wall-depth{opacity:.9;}
#board .pad.burned .pad-face{fill:var(--pad-dead)!important;stroke:#8b95a3!important;opacity:.5;}
#board .pad.burned .pad-side{opacity:.35;}
#board .pad.burned .pad-sheen{opacity:.15;}
#board .wall-stone{fill:var(--stone-1);stroke:var(--stone-2);stroke-width:2.4;}
#board .wall-sheen{fill:var(--stone-sheen);opacity:.7;}
#board .star-halo{fill:var(--c-green);opacity:.16;}#board .star-halo2{fill:var(--c-green);opacity:.22;}
#board .star-blue .star-halo,#board .star-blue .star-halo2{fill:var(--c-blue);}
#board .star-red .star-halo,#board .star-red .star-halo2{fill:var(--c-red);}
#board .star-yellow .star-halo,#board .star-yellow .star-halo2{fill:var(--c-yellow);}
#board .glow-flood{flood-color:var(--glow);}
#board .star-off{opacity:.22;}
#board .piece-g{cursor:pointer;transition:transform .28s cubic-bezier(.3,1.3,.5,1);}
#board .piece-g.dim{opacity:.4;}
#board .move-halo{fill:none;stroke:#fff;stroke-width:4;opacity:.9;filter:drop-shadow(0 0 6px var(--glow));animation:halo 1.1s ease-in-out infinite;}
@keyframes halo{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:.4}}
#board .sel-ring{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:7 6;animation:spin 8s linear infinite;}
@keyframes spin{to{stroke-dashoffset:120}}
#board .stack-badge rect{fill:#090D16;}#board .stack-badge text{fill:#fff;font-family:var(--mono);font-size:14px;font-weight:700;}
#board .cellhit{cursor:pointer;filter:drop-shadow(0 8px 6px rgba(11,18,32,.28));}
#board .dest-cell{fill:currentColor;opacity:.16;}
#board .dest-dot{fill:currentColor;animation:halo 1.1s ease-in-out infinite;}
#board .dest-lab-bg{fill:currentColor;}#board .dest-lab{fill:#fff;font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.06em;}
#board .dest-move{color:var(--d-move)}#board .dest-stomp{color:var(--d-stomp)}#board .dest-support{color:var(--d-support)}
#board .dest-lock{color:var(--d-lock)}#board .dest-risk{color:var(--d-risk)}
#board .fx-ring{fill:none;stroke:#fff;stroke-width:6;}
/* directional sun + cast shadows on the far side, objects throw toward the player */
#board .wall,#board .star-shape,#board .tok{filter:drop-shadow(9px 14px 4px rgba(23,18,8,.28));}
#board .cellhit .dest-cell,#board .cellhit .dest-dot{filter:none;}
/* pieces hop while moving */
#board .piece-g.hopping .tok{animation:tokhop .26s ease;}
@keyframes tokhop{0%,100%{translate:0 0}50%{translate:0 -14px}}

/* camera angle switch */
.view-switch{display:flex;gap:6px;margin-top:16px;padding:5px;border-radius:14px;background:rgba(9,13,22,.055);box-shadow:inset 0 1px 3px rgba(9,13,22,.08);}
.view-btn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:10px;border:none;cursor:pointer;background:transparent;color:var(--ink-soft);transition:all .3s cubic-bezier(.16,1,.3,1);}
.view-btn:hover{color:var(--ink);}
.view-btn.on{background:#090D16;color:#fff;box-shadow:0 8px 18px -8px rgba(9,13,22,.5);}

/* overlays */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(9,13,22,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
#rulesModal{z-index:90;}#confirmModal{z-index:100;}
.overlay-card{width:100%;max-width:560px;padding:4px;border-radius:30px;}
.overlay-card>.inner,.overlay-card{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,255,255,.8));border:1px solid rgba(255,255,255,.95);
  box-shadow:0 40px 90px -20px rgba(9,13,22,.5);border-radius:30px;}
.overlay-card{padding:34px 36px;text-align:center;animation:pop .4s cubic-bezier(.16,1,.3,1);}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.overlay-card .big-star{width:104px;height:104px;margin-bottom:6px;}
.overlay-card h2{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
.overlay-card p{color:var(--ink-soft);font-size:16px;margin-bottom:20px;font-weight:600;}
.modal-rules .overlay-card{max-width:840px;text-align:left;max-height:88vh;display:flex;flex-direction:column;padding:0;}
.rules-head{padding:26px 32px 0;}.rules-head h2{text-align:center;}
.rules-body{flex:1 1 auto;overflow-y:auto;padding:14px 32px;font-size:14.5px;line-height:1.7;}
.rules-body h3{color:var(--accent);font-size:16px;margin:16px 0 6px;}
.rules-body ul{margin-left:20px;}.rules-body p{margin-bottom:8px;color:var(--ink);}
.rules-body .house-note{margin-top:16px;padding:14px 18px;border-radius:14px;background:rgba(14,123,196,.08);border:1px dashed rgba(14,123,196,.3);color:var(--ink-soft);font-size:13px;}
.rules-footer{flex:0 0 auto;padding:16px 32px 24px;border-top:1px solid rgba(226,232,240,.9);text-align:center;}
.end-scores{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:15px;}
.end-scores th,.end-scores td{padding:9px 10px;text-align:center;border-bottom:1px solid rgba(226,232,240,.9);}
.end-scores th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.end-scores td:first-child,.end-scores th:first-child{text-align:left;}
.end-scores .win td{background:rgba(18,184,134,.12);font-weight:800;}
.end-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.nexus-note{font-weight:700;color:var(--c-red)!important;}
.nexus-box{background:rgba(255,255,255,.7);border:1px solid rgba(226,232,240,.9);border-radius:16px;padding:16px;margin-bottom:16px;text-align:left;}
.sprint-log{font-family:var(--mono);font-size:13px;margin-top:8px;}.sprint-win{color:var(--c-green);font-weight:700;}

/* toast engine */
.toast-stack{position:fixed;right:22px;bottom:22px;z-index:120;display:flex;flex-direction:column;gap:12px;max-width:360px;}
.toast{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;
  background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,255,255,.86));border:1px solid rgba(255,255,255,.9);
  box-shadow:0 20px 44px -16px rgba(9,13,22,.4);backdrop-filter:blur(20px);opacity:0;transform:translateX(30px);transition:all .32s cubic-bezier(.16,1,.3,1);}
.toast.show{opacity:1;transform:translateX(0);}
.tt-badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;color:#fff;padding:4px 8px;border-radius:8px;background:#8b95a3;}
.toast-info .tt-badge{background:var(--accent)}.toast-warn .tt-badge{background:var(--d-risk)}
.toast-success .tt-badge{background:var(--d-move)}.toast-error .tt-badge{background:var(--d-stomp)}
.tt-body{display:flex;flex-direction:column;gap:2px;}.tt-body b{font-size:14px;}.tt-body span{font-size:12.5px;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="stage"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<section id="setup" class="screen">
  <div class="hero">
    <div class="eyebrow">Offline · Rock — Paper — Scissors Arena · 3D</div>
    <h1 class="logo">RoSham <em>Bo</em></h1>
    <p class="tagline">The Grid Arena — stomp, liberate, and keep your squad standing.</p>
    <div id="starsStrip" class="stars-strip"></div>
  </div>
  <div class="setup-card spotlight-prism"><div class="setup-inner prism-chamber">
    <div class="field-label">Players</div>
    <div class="count-row">
      <button class="count-btn" data-n="2">2</button>
      <button class="count-btn" data-n="3">3</button>
      <button class="count-btn" data-n="4">4</button>
    </div>
    <div class="field-label">Seating &amp; Control</div>
    <div id="seats" class="seats"></div>
    <div class="setup-actions">
      <button class="btn-primary" data-nav="start">Start the Match</button>
      <button class="btn-ghost" data-nav="rules">How to Play</button>
    </div>
  </div></div>
</section>

<section id="game" class="screen hidden">
  <header class="topbar">
    <div class="brand">RoSham <em>Bo</em></div>
    <div id="turnPill" class="turn-pill"><span class="tp-dot"></span><span id="turnName">—</span></div>
    <div class="tb-actions">
      <button class="icon-btn" data-nav="sound">🔊 Sound</button>
      <button class="icon-btn" data-nav="rules">📜 Rules</button>
      <button class="icon-btn" data-nav="quit">↩ New Game</button>
    </div>
  </header>
  <main class="layout">
    <aside id="leftPanel" class="col-left"></aside>
    <section class="col-board">
      <div class="board-wrap">
        <svg id="board" viewBox="0 0 1040 1040" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="controls">
        <div id="die" class="die cube3d">
          <span class="face f1"><i class="c"></i></span>
          <span class="face f2"><i class="tl"></i><i class="br"></i></span>
          <span class="face f3"><i class="tl"></i><i class="c"></i><i class="br"></i></span>
          <span class="face f4"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></span>
          <span class="face f5"><i class="tl"></i><i class="tr"></i><i class="c"></i><i class="bl"></i><i class="br"></i></span>
          <span class="face f6"><i class="tl"></i><i class="tr"></i><i class="ml"></i><i class="mr"></i><i class="bl"></i><i class="br"></i></span>
        </div>
        <button id="rollBtn" class="roll-btn">Roll the Die</button>
      </div>
      <div id="statusLine" class="status-line"></div>
      <div class="view-switch" role="group" aria-label="Camera angle">
        <button class="view-btn" data-v="6">▤ Tactical</button>
        <button class="view-btn on" data-v="22">◇ Arena</button>
        <button class="view-btn" data-v="36">⬢ Diorama</button>
      </div>
      <div id="chaseBanner" class="chase-banner"></div>
    </section>
    <aside id="rightPanel" class="col-right"><div class="panel-title">Battle Log</div><div id="log" class="log"></div></aside>
  </main>
</section>

<div id="passOverlay" class="overlay hidden"><div class="overlay-card"><div id="passStar"></div><h2 id="passTitle"></h2><p id="passText"></p><button class="btn-primary" id="passBtn">I'm Ready</button></div></div>
<div id="rulesModal" class="overlay modal-rules hidden"><div class="overlay-card"><div class="rules-head"><h2>📜 Official Rulebook</h2></div><div id="rulesBody" class="rules-body"></div><div class="rules-footer"><button class="btn-primary" data-nav="closeRules">Got it!</button></div></div></div>
<div id="endOverlay" class="overlay hidden"><div class="overlay-card"><div id="endStar"></div><h2 id="endTitle"></h2><p id="endSub"></p><table class="end-scores" id="endTable"></table><div id="nexusArea"></div><div class="end-actions"><button class="btn-primary" id="endAgainBtn">Play Again</button><button class="btn-ghost" id="endRulesBtn">Rules</button></div></div></div>
<div id="confirmModal" class="overlay hidden"><div class="overlay-card"><h2>Leave the match?</h2><p>Your current progress will be lost.</p><div class="end-actions"><button class="btn-primary" data-nav="confirmQuit">Yes, new game</button><button class="icon-btn" data-nav="confirmCancel">Stay</button></div></div></div>
<div id="toastStack" class="toast-stack"></div>

<script src="engine.js"></script>
<script>
/* cursor spotlight for glass cards */
document.addEventListener("pointermove",e=>{
  const card=e.target.closest(".spotlight-prism,.setup-card,.pcard,.overlay-card");
  if(!card)return; const r=card.getBoundingClientRect();
  card.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");
  card.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%");
});
/* 3D arena: the board tilts toward your cursor like a real table */
(function(){
  const wrap=document.querySelector(".board-wrap"), bd=document.getElementById("board");
  if(!wrap||!bd)return;
  let baseRX=22;
  const setTilt=(rx,ry)=>{ bd.style.setProperty("--rx",rx+"deg"); bd.style.setProperty("--ry",(ry||0)+"deg"); };
  wrap.addEventListener("pointermove",e=>{
    const r=wrap.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;
    setTilt(baseRX-py*9, px*7);
  });
  wrap.addEventListener("pointerleave",()=>setTilt(baseRX,0));
  document.querySelector(".view-switch").addEventListener("click",e=>{
    const b=e.target.closest(".view-btn"); if(!b)return;
    baseRX=+b.dataset.v;
    document.querySelectorAll(".view-btn").forEach(x=>x.classList.toggle("on",x===b));
    setTilt(baseRX,0);
  });
})();
</script>
</body>
</html>
